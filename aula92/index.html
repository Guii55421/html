<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — Class e ID</title>
  <link rel="stylesheet" href="style2.css">
  
</head>
<body>

  <main>
    <h1>Livraria</h1>

    <!-- CLASSE + ID: herda o visual de .card e o ID sobrescreve o que muda -->
    <div class="card" id="promo-dia">
      <h4>Promoção do dia</h4>
      <p>Veja as novas opções de livros por até 50% de desconto!</p>
    </div>

    <!-- SÓ A CLASSE BASE -->
    <div class="card">
      <h4>Generos</h4>
      <p>Veja os diferentes gêneros literários disponíveis!</p>
    </div>

    <!-- DUAS CLASSES: card + destaque (separadas por espaço) -->
    <div class="card destaque">
      <h4>Livros Best-sellers</h4>
      <p>Confira os livros mais vendidos da atualidade. R$ 39,90</p>
    </div >

    <!-- DUAS CLASSES: card + esgotado -->
    <div class="card esgotado">
      <h4>Coleção Harry Potter</h4>
      <p>Volta amanhã! R$ 599,99</p>
    </div>
  </main>
   <a href="../index.html"><button style="background-color: #4A3B36; color: #ffffff; border: 4px solid #d92219; border-radius: 25px; width: 70px; height: 50px;">Voltar</button></a>

</body>
</html>
