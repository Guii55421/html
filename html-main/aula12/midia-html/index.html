<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mídia em HTML — Cafeteria Grão Dourado</title>
</head>
<body>

  <h1>Fórmula 1: Muito Além de uma Corrida</h1>
  <p>Vídeo, áudio, YouTube e PDF em uma única página.</p>

  <!-- ===== VÍDEO ===== -->
  <h2>Nosso vídeo</h2>
  <video width="640" height="360" controls poster="imagem/poster.jpg" preload="metadata">
    <source src="video/cafe.mp4" type="video/mp4">
    <source src="video/cafe.webm" type="video/webm">
    <track src="video/legenda.vtt" kind="subtitles" srclang="pt" label="Português" default>
    Seu navegador não suporta vídeo.
    <a href="video/cafe.mp4">Baixe o vídeo (MP4)</a>.
  </video>

  <!-- ===== ÁUDIO ===== -->
  <h2>Parada pro BOX!</h2>
  <audio controls>
    <source src="audio/F1 Radio - Sound effect (HD) - HighQualitySFX (128k).mp3" type="audio/mpeg">
    <source src="audio/F1 Radio - Sound effect (HD) - HighQualitySFX (128k).ogg" type="audio/ogg">
    Seu navegador não suporta áudio.
    <a href="audio/F1 Radio - Sound effect (HD) - HighQualitySFX (128k).mp3">Baixe a vinheta (MP3)</a>.
  </audio>

  <!-- ===== YOUTUBE ===== -->
  <h2>Vídeo do YouTube</h2>
  <!-- Troque SEU_ID_DO_VIDEO pelo código que aparece depois de "v=" no endereço do vídeo -->
  <iframe width="560" height="315"
          src="https://www.youtube.com/embed/OYAgvuEDyHw?si=Ovl9y2jyTygz24ih"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>

  <!-- ===== PDF ===== -->
  <h2>Nosso cardápio</h2>
  <object data="docs/cardapio.pdf" type="application/pdf" width="640" height="400">
    Seu navegador não mostra PDF aqui.
    <a href="docs/cardapio.pdf">Abra o cardápio em PDF</a>.
  </object>

</body>
</html>
